<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" width="480" height="270" role="img" aria-label="Helm analytics, animated">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e2023"/>
      <stop offset="100%" stop-color="#151618"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5c9aff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#5c9aff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="480" height="270" rx="14" fill="url(#bg)"/>

  <!-- header -->
  <circle cx="30" cy="32" r="9" fill="#5c9aff"/>
  <path d="M26 32 a4 4 0 1 0 8 0 a4 4 0 1 0 -8 0 M30 24 v16 M22 32 h16" stroke="#0a0f1a" stroke-width="1.4" fill="none"/>
  <text x="48" y="37" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#edeef2">Helm</text>
  <rect x="392" y="22" width="62" height="22" rx="11" fill="#c9a033"/>
  <text x="423" y="37" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="700" fill="#1a1407">PRO</text>

  <!-- gridlines -->
  <g stroke="#45484d" stroke-width="1" stroke-dasharray="3 5" opacity="0.5">
    <line x1="30" y1="90" x2="450" y2="90"/>
    <line x1="30" y1="150" x2="450" y2="150"/>
    <line x1="30" y1="210" x2="450" y2="210"/>
  </g>

  <!-- area + line (draws on) -->
  <path d="M30 210 L30 200 L100 185 L170 188 L240 150 L310 130 L380 95 L450 70 L450 210 Z" fill="url(#area)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.4s" fill="freeze"/>
  </path>
  <path d="M30 200 L100 185 L170 188 L240 150 L310 130 L380 95 L450 70"
        fill="none" stroke="#5c9aff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
        stroke-dasharray="560" stroke-dashoffset="560">
    <animate attributeName="stroke-dashoffset" from="560" to="0" dur="1.4s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1" keyTimes="0;1" values="560;0"/>
  </path>

  <!-- data points -->
  <g fill="#c9a033">
    <circle cx="240" cy="150" r="4" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.1s" fill="freeze"/></circle>
    <circle cx="380" cy="95" r="4" opacity="0"><animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.4s" fill="freeze"/></circle>
    <circle cx="450" cy="70" r="5" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.3s" begin="1.6s" fill="freeze"/>
      <animate attributeName="r" values="5;8;5" dur="1.6s" begin="1.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="30" y="250" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#9b9ea5">Active users · +74% this quarter</text>
</svg>
