name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Required for installing restricted @tour-kit/* pro packages
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.26.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for leaked server secrets
        run: pnpm --filter @tour-kit/docs check:secrets

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Build packages
        run: pnpm build --filter='./packages/*'

      - name: Test
        run: pnpm test --filter='./packages/*'

      - name: Test docs
        run: pnpm --filter @tour-kit/docs test

  # Bundle size gate runs in .github/workflows/size-limit.yml on every PR
  # (binding raw dist-gzip checker + informational size-limit smoke signal).

  # TODO: Re-enable when LLM file generation is deterministic across environments
  # llm-freshness:
  #   name: LLM Files Freshness
  #   ...
