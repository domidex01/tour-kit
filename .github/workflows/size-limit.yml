name: Size Limit

on:
  pull_request:
    branches: [main]

jobs:
  size:
    name: Size Limit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build:packages

      # BINDING merge gate: raw dist-gzip budgets (audit F-2 unit). A breach
      # here fails the job and blocks the PR. Packages are already built above.
      - name: Bundle size gate (binding — raw dist gzip)
        run: node tooling/bundle-check/check-dist-gzip.mjs

      # Secondary smoke signal: size-limit reports bundled-with-deps + brotli,
      # a different unit calibrated independently in /.size-limit.json. It is
      # informational only — `continue-on-error` keeps a size-limit breach from
      # blocking merge (per the Sprint-1 load-bearing-gate decision). Direct CLI
      # invocation (no `andresz1/size-limit-action@v1`, which fails computing a
      # base-branch diff for scripts introduced in the PR); trade-off: no diff
      # comment, acceptable since the binding gate above is the real check.
      - name: size-limit (informational smoke signal)
        run: pnpm exec size-limit
        continue-on-error: true
