packages:
  - "packages/*"
  - "apps/*"
  - "!apps/smoke"
  - "tooling/*"
  - "examples/*"
  # QA consumer dashboards install from npm/local tarballs (not workspace symlinks).
  # Excluded so root `pnpm install` does not link @tour-kit/* deps as workspace:*.
